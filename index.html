<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis calorías</title>
<meta name="theme-color" content="#2A7F77">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF2F4; --card:#FFFFFF; --ink:#16283A; --muted:#5E7080; --line:#D5DEE4;
  --ok:#2A7F77; --warn:#D9962B; --over:#C44536; --track:#DCE5EA; --soft:#E3EDF0;
  --p:#3D6FB6; --c:#D9962B; --f:#8A5CA8;
  --head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A24; --card:#182736; --ink:#E6EEF3; --muted:#92A5B4; --line:#2A3C4C;
    --ok:#4DB8AE; --warn:#EDB254; --over:#E96B5B; --track:#25394A; --soft:#1F3141;
    --p:#7BA6E6; --c:#EDB254; --f:#C39BDB;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A24; --card:#182736; --ink:#E6EEF3; --muted:#92A5B4; --line:#2A3C4C;
  --ok:#4DB8AE; --warn:#EDB254; --over:#E96B5B; --track:#25394A; --soft:#1F3141;
  --p:#7BA6E6; --c:#EDB254; --f:#C39BDB;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
main{max-width:520px;margin:0 auto;padding:16px 16px 48px}
h1,h2,.num{font-family:var(--head);margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
[hidden]{display:none!important}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.top h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.daynav{display:flex;align-items:center;gap:4px}
.daynav button{border:1px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:40px;font-size:18px}
.daynav .lbl{min-width:112px;text-align:center;font-weight:600;font-size:15px;background:none;border:0;width:auto;padding:0 4px}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}

.hero{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:176px;height:176px;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring .track{stroke:var(--track)}
.ring .bar{transition:stroke-dashoffset .5s ease, stroke .3s}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mid .num{font-size:40px;font-weight:700;line-height:1}
.mid small{color:var(--muted);font-size:13px;margin-top:4px}
.stats{flex:1;min-width:0;display:grid;gap:10px}
.stat{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px}
.stat:last-child{border:0;padding:0}
.stat span{color:var(--muted);font-size:14px}
.stat b{font-family:var(--head);font-size:20px}
.msg{margin:14px 0 0;font-size:14.5px;color:var(--muted)}
.msg.over{color:var(--over);font-weight:600}

.macros{display:grid;gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.mac .h{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.mac .h span{font-weight:600}
.mac .h em{font-style:normal;color:var(--muted)}
.mac .t{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.mac .t i{display:block;height:100%;border-radius:99px;transition:width .4s}
.mac.over .h em{color:var(--over);font-weight:600}

h2{font-size:17px;font-weight:700;margin-bottom:12px}
.seg{display:grid;gap:6px;margin-bottom:10px}
.seg.m4{grid-template-columns:repeat(4,1fr)}
.seg.m2{grid-template-columns:1fr 1fr}
.seg button{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:9px 2px;font-size:13.5px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
input,select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 12px;width:100%}
input.kcal{max-width:112px}
.btn{background:var(--ok);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:600}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.full{width:100%;margin-top:10px}
.btn[disabled]{opacity:.55}
.favs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 12px;font-size:13.5px}
.chip b{font-weight:600;margin-left:4px;color:var(--muted)}
.mg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}

.results{margin-top:8px;display:grid}
.res-i{display:flex;justify-content:space-between;gap:10px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;width:100%}
.res-i span:first-child{overflow-wrap:anywhere}
.res-i span:last-child{color:var(--muted);font-size:13px;white-space:nowrap}
.ai-box{margin-top:10px;background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14.5px}
.ai-box p{margin:0 0 8px}
.port{margin-top:12px;background:var(--soft);border-radius:14px;padding:14px}
.port h3{margin:0 0 10px;font-family:var(--head);font-size:17px;overflow-wrap:anywhere}
.port .tag{display:inline-block;font-size:12px;font-weight:600;color:var(--warn);margin-left:6px}
.pgrid{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.pv{margin-top:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.pv div{background:var(--card);border-radius:10px;padding:8px 2px}
.pv b{display:block;font-family:var(--head);font-size:18px}
.pv small{color:var(--muted);font-size:12px}
.pv .big b{color:var(--ok)}

.meal{margin-top:6px}
.meal+.meal{margin-top:14px}
.meal-h{display:flex;justify-content:space-between;font-weight:600;font-size:14.5px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.meal-h span:last-child{color:var(--muted)}
.item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.item .n{flex:1;min-width:0;overflow-wrap:anywhere}
.item .n small{display:block;color:var(--muted);font-size:12.5px}
.item .k{font-weight:600;white-space:nowrap}
.item .x{border:0;background:none;color:var(--muted);font-size:20px;width:34px;height:34px;border-radius:8px;line-height:1}
.item .x:hover{color:var(--over)}
.empty{color:var(--muted);font-size:14.5px;margin:0}

.week{display:flex;align-items:flex-end;gap:8px;height:130px;position:relative;padding-top:6px}
.wk{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px;border:0;background:none;padding:0}
.wk .col{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:var(--ok);min-height:3px}
.wk.over .col{background:var(--over)}
.wk.none .col{background:var(--track)}
.wk .d{font-size:12px;color:var(--muted)}
.wk.sel .d{color:var(--ink);font-weight:700}
.wk.sel .col{outline:2px solid var(--ink);outline-offset:2px}
.wkwrap{position:relative}
.goalline{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);opacity:.6;pointer-events:none}
.wknote{font-size:13px;color:var(--muted);margin:10px 0 0}

.wchart{width:100%;height:auto;display:block;margin-top:12px}
.wsum{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:14px;color:var(--muted)}
.wsum b{color:var(--ink);font-family:var(--head);font-size:17px}

details summary{cursor:pointer;font-weight:600;font-family:var(--head);font-size:17px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-size:22px;color:var(--muted)}
details[open] summary::after{content:"–"}
.set{margin-top:14px;display:grid;gap:12px}
label{font-size:13.5px;color:var(--muted);display:grid;gap:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.res{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14.5px}
.res b{font-family:var(--head);font-size:18px}
.note{font-size:13px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
@media (max-width:400px){
  .hero{flex-direction:column;align-items:stretch}
  .ring{margin:0 auto}
}
@media (prefers-reduced-motion:reduce){.ring .bar,.toast,.mac .t i{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Mis calorías</h1>
    <div class="daynav">
      <button id="prev" aria-label="Día anterior">‹</button>
      <button id="today" class="lbl" aria-label="Ir a hoy"></button>
      <button id="next" aria-label="Día siguiente">›</button>
    </div>
  </div>

  <section class="card">
    <div class="hero">
      <div class="ring" aria-hidden="true">
        <svg width="176" height="176" viewBox="0 0 176 176">
          <circle class="track" cx="88" cy="88" r="76" fill="none" stroke-width="16"/>
          <circle class="bar" id="bar" cx="88" cy="88" r="76" fill="none" stroke-width="16" stroke-linecap="round" stroke-dasharray="477.5" stroke-dashoffset="477.5"/>
        </svg>
        <div class="mid"><div class="num" id="midnum">0</div><small id="midlbl">kcal restantes</small></div>
      </div>
      <div class="stats">
        <div class="stat"><span>Consumidas</span><b id="eaten">0</b></div>
        <div class="stat"><span>Meta diaria</span><b id="goal">2000</b></div>
      </div>
    </div>
    <p class="msg" id="msg"></p>
    <div class="macros" id="macros"></div>
  </section>

  <section class="card">
    <h2>Agregar comida</h2>
    <div class="seg m4" id="meals" role="group" aria-label="Momento del día"></div>
    <div class="seg m2" id="modes" role="group" aria-label="Forma de agregar"></div>

    <div id="paneSearch">
      <input id="q" type="search" placeholder="Busca un alimento: pollo, arroz, manzana…" autocomplete="off" aria-label="Buscar alimento">
      <div class="results" id="results"></div>
      <div class="ai-box" id="aiBox" hidden></div>
      <div class="port" id="port" hidden></div>
    </div>

    <div id="paneManual" hidden>
      <div class="row">
        <input id="name" type="text" placeholder="¿Qué comiste?" autocomplete="off" maxlength="60" aria-label="Nombre de la comida">
        <input id="kcal" class="kcal" type="number" inputmode="numeric" min="0" max="5000" placeholder="kcal" aria-label="Calorías">
      </div>
      <div class="mg3">
        <input id="mp" type="number" inputmode="decimal" min="0" placeholder="Prot. g" aria-label="Proteína en gramos">
        <input id="mc" type="number" inputmode="decimal" min="0" placeholder="Carbos g" aria-label="Carbohidratos en gramos">
        <input id="mf" type="number" inputmode="decimal" min="0" placeholder="Grasa g" aria-label="Grasa en gramos">
      </div>
      <button class="btn full" id="add">Agregar</button>
    </div>
    <div class="favs" id="favs"></div>
  </section>

  <section class="card">
    <h2 id="listTitle">Lo que llevas hoy</h2>
    <div id="list"></div>
  </section>

  <section class="card">
    <h2>Últimos 7 días</h2>
    <div class="wkwrap">
      <div class="goalline" id="goalline"></div>
      <div class="week" id="week"></div>
    </div>
    <p class="wknote" id="wknote"></p>
  </section>

  <section class="card">
    <h2>Peso</h2>
    <div class="row">
      <input id="wIn" type="number" inputmode="decimal" step="0.1" min="20" max="400" placeholder="Peso en kg" aria-label="Peso en kilogramos">
      <button class="btn" id="wSave">Registrar</button>
    </div>
    <p class="note" id="wHint" style="margin-top:8px"></p>
    <div id="wBox"></div>
  </section>

  <section class="card">
    <details id="cfg">
      <summary>Metas y calculadora</summary>
      <div class="set">
        <label>Meta diaria (kcal)
          <div class="row"><input id="goalIn" type="number" inputmode="numeric" min="500" max="6000"><button class="btn" id="saveGoal">Guardar</button></div>
        </label>
        <div>
          <div class="g3">
            <label>Proteína (g)<input id="gp" type="number" inputmode="numeric" min="0"></label>
            <label>Carbos (g)<input id="gc" type="number" inputmode="numeric" min="0"></label>
            <label>Grasa (g)<input id="gf" type="number" inputmode="numeric" min="0"></label>
          </div>
          <div class="row" style="margin-top:8px">
            <button class="btn ghost" id="saveMg" style="flex:1">Guardar macros</button>
            <button class="btn ghost" id="resetMg" style="flex:1">Restablecer</button>
          </div>
          <p class="note" style="margin-top:8px">Por defecto: 30 % proteína, 40 % carbohidratos y 30 % grasa de tu meta.</p>
        </div>
        <p class="note">¿No sabes qué meta poner? Estima tu gasto diario con la fórmula Mifflin-St Jeor.</p>
        <div class="g2">
          <label>Sexo<select id="sex"><option value="m">Hombre</option><option value="f">Mujer</option></select></label>
          <label>Edad<input id="age" type="number" inputmode="numeric" min="14" max="100" placeholder="años"></label>
        </div>
        <div class="g2">
          <label>Peso (kg)<input id="wt" type="number" inputmode="decimal" min="30" max="300" placeholder="kg"></label>
          <label>Altura (cm)<input id="ht" type="number" inputmode="numeric" min="120" max="230" placeholder="cm"></label>
        </div>
        <div class="g2">
          <label>Actividad
            <select id="act">
              <option value="1.2">Sedentaria</option>
              <option value="1.375" selected>Ligera (1–3 días)</option>
              <option value="1.55">Moderada (3–5 días)</option>
              <option value="1.725">Alta (6–7 días)</option>
            </select>
          </label>
          <label>Déficit
            <select id="def">
              <option value="0.10">10 %</option>
              <option value="0.15" selected>15 %</option>
              <option value="0.20">20 %</option>
            </select>
          </label>
        </div>
        <button class="btn ghost" id="calc">Calcular</button>
        <div class="res" id="res" hidden></div>
      </div>
    </details>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

      var d = el("div", x[2]); var b = el("b", null, "0"); b.id = x[0]; d.appendChild(b); d.appendChild(el("small", null, x[1])); pv.appendChild(d);
    });
    box.appendChild(pv);
    var g = el("p", "note", ""); g.id = "pvg"; g.style.marginTop = "8px"; box.appendChild(g);
    if (f.ai) box.appendChild(el("p", "note", "Valores aproximados: una estimación puede variar según la receta y la porción real."));
    var add = el("button", "btn full"); add.type = "button"; add.id = "pAdd";
    add.onclick = function(){
      var r = calcPort();
      if (!r){ toast("Indica la cantidad"); qty.focus(); return; }
      var name = f.n + " · " + fmt(r.grams) + " g";
      if (addEntry(name, r.kcal, r.p, r.c, r.f)){
        box.hidden = true; box.innerHTML = ""; sel = null;
        $("q").value = ""; renderResults();
      }
    };
    box.appendChild(add);
    renderPortionBtn(); updatePreview();
    box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  /* ---------- metas ---------- */
  $("saveGoal").onclick = function(){
    var g = Math.round(+$("goalIn").value);
    if (!(g >= 500 && g <= 6000)){ toast("Ingresa una meta entre 500 y 6000"); return; }
    state.goal = g; persist(); renderAll(); toast("Meta guardada");
  };
  $("saveMg").onclick = function(){
    var p = Math.round(+$("gp").value), c = Math.round(+$("gc").value), f = Math.round(+$("gf").value);
    if (!(p >= 0 && c >= 0 && f >= 0) || (p + c + f) === 0){ toast("Revisa los gramos de cada macro"); return; }
    state.mg = { p: p, c: c, f: f }; persist(); renderAll(); toast("Macros guardados");
  };
  $("resetMg").onclick = function(){ state.mg = null; persist(); renderAll(); toast("Macros restablecidos"); };

  $("calc").onclick = function(){
    var p = { sex: $("sex").value, age: +$("age").value, wt: +$("wt").value, ht: +$("ht").value, act: $("act").value, def: $("def").value };
    var res = $("res");
    if (!(p.age > 0 && p.wt > 0 && p.ht > 0)){ res.hidden = false; res.textContent = "Completa edad, peso y altura."; return; }
    var bmr = 10*p.wt + 6.25*p.ht - 5*p.age + (p.sex === "m" ? 5 : -161);
    var tdee = bmr * +p.act;
    var target = Math.round(tdee * (1 - +p.def) / 10) * 10;
    state.profile = p; persist();
    res.hidden = false; res.innerHTML = "";
    var l1 = el("div"); l1.appendChild(document.createTextNode("Gasto diario estimado: ")); l1.appendChild(el("b", null, fmt(Math.round(tdee/10)*10) + " kcal"));
    var l2 = el("div"); l2.appendChild(document.createTextNode("Meta con " + Math.round(+p.def*100) + " % de déficit: ")); l2.appendChild(el("b", null, fmt(target) + " kcal"));
    res.appendChild(l1); res.appendChild(l2);
    if (target < 1200){
      var w = el("p", "note", "Es una meta bastante baja. Conviene revisarla con un profesional de la salud."); w.style.marginTop = "8px"; res.appendChild(w);
    }
    var use = el("button", "btn full", "Usar " + fmt(target) + " kcal como meta"); use.type = "button";
    use.onclick = function(){ state.goal = target; persist(); renderAll(); toast("Meta actualizada"); };
    res.appendChild(use);
    var n = el("p", "note", "Es una estimación. Ajusta según cómo evolucione tu peso en 2–3 semanas."); n.style.marginTop = "8px"; res.appendChild(n);
  };

  var had = loadLocal();
  renderAll();
  connectDb(had);
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
</body>
